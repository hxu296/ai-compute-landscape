name: Daily data and publication
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'scratchpad/**'
permissions:
  contents: read
concurrency:
  group: landscape-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate capacity arithmetic and owner stacks
        run: node --test tests/*.test.cjs
      - name: Validate adapters and failure behavior
        run: python -m unittest discover -s automation/tests -v
      - name: Refresh dated public feeds
        if: github.event_name != 'push'
        run: python automation/refresh.py
      - name: Refresh research inputs (benchmark selection, data-center timelines)
        if: github.event_name != 'push'
        continue-on-error: true
        run: python automation/refresh_research.py
      - name: Roll the token projection forward to today
        if: github.event_name != 'push'
        continue-on-error: true
        run: python automation/roll_projection.py && python automation/build_research.py
      - name: Validate editorial input and cached feeds
        if: github.event_name == 'push'
        run: python automation/refresh.py --offline
      - name: Build public release
        run: python automation/package.py
      - name: Check the built page in Chrome
        run: |
          npm install --no-save --no-package-lock playwright-core@1.47.2
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" node tests/browser.check.cjs _site/index.html
      - name: Retain normalized daily observations
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live.json data/live.js data/history research/capacity-expanded.json research/dc-timelines.json research/demand-research.json research/us-sites.json data/research.js
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh dated public benchmark and research observations'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Retain source responses and failure diagnostics
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: source-responses-${{ github.run_id }}
          path: .cache/etl
          retention-days: 30
          if-no-files-found: ignore
